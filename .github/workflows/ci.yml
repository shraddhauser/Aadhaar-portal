name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Lint and test (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check dependency conflicts
        run: pip check
      - name: Lint (ruff)
        run: ruff check backend scripts tests
      - name: Test (pytest)
        run: pytest --cov=backend --cov-report=term

  javascript:
    name: Lint frontend JS (oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint (oxlint, errors fail the build)
        run: npx --yes oxlint@1.9.0 frontend/js
