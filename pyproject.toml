[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
# Ruff defaults (pyflakes + core pycodestyle errors).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Scripts add the repo root to sys.path before importing backend modules.
"scripts/*" = ["E402"]
